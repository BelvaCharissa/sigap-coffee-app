version: '3.8'

services:
  core-service:
    build: .
    container_name: sigap-core-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      - PORT=3000
      - NODE_ENV=production
    mem_limit: 256m
    cpus: 0.5
    networks:
      - sigap-internal

  gateway:
    image: nginx:1.28-alpine
    container_name: sigap-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      - core-service
    networks:
      - sigap-internal

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sigap-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN}
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      - gateway
    networks:
      - sigap-internal

networks:
  sigap-internal:
    driver: bridge
