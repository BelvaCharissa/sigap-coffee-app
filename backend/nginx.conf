# Nginx Gateway Configuration for SIGAP Microservice
# Limits memory & handles rate limiting for public and peer traffic

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Rate Limiting Zone: 15 requests per second per IP with burst
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_status 429;

    # Basic performance tuning for low-spec STB
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_body_buffer_size 128k;

    upstream core_backend {
        server core-service:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Health endpoint without rate limit
        location = /api/health {
            proxy_pass http://core_backend/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate limited API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://core_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Default fallback
        location / {
            return 200 '{"service":"sigap-gateway","status":"online","docs":"/api/health"}\n';
        }
    }
}
